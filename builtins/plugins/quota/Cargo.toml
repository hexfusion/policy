# praxis-policy-plugin-quota — durable per-consumer token
# quota, enforced as a policy against a standalone Limitador.
#
# Registers a pre-invoke check on `cmf.llm_input` and a post-invoke
# debit on `cmf.llm_output`. The counter lives in Limitador (durable,
# replica-correct), not in the pod.
#
# The Limitador calls go through the host HTTP transport (the `perform_http`
# capability), so the plugin carries no HTTP client or TLS stack of its own.
# Lightweight (serde only), so it stays in the workspace's default-members.

[package]
name = "praxis-policy-plugin-quota"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PPE policy plugin — durable per-consumer token quota backed by Limitador."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# Exposes the hot-path functions for the microbenchmark. Off by default, so
# a normal build keeps them private.
bench = []

[dependencies]
praxis-policy-core = { workspace = true }

# The JSON request bodies for Limitador `/check` and `/report`. The bytes
# are handed to the host transport; no HTTP client lives here.
bytes = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `test-util` exposes `http_testing::FakeTransport`, which scripts Limitador
# responses (and a failure or withheld grant) without a socket. The
# cross-request accounting test adds a small in-process stateful transport, so
# no mock HTTP server is needed.
praxis-policy-core = { workspace = true, features = ["test-util"] }
# `#[tokio::test]` for the async client/handler tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Hot-path microbenchmark harness. Light dep tree, and the plugin's first
# bench, so it stays a dev-dependency behind the `bench` feature.
divan = "0.1"

[[bench]]
name = "hot_path"
harness = false
required-features = ["bench"]

[lints]
workspace = true
